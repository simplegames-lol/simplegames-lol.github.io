<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Simple Games — pick a game and play." />
    <title>Simple Games</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles.css?v=2" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
      <a class="brand" href="/" aria-label="Simple Games home">
        <span>Simple Games</span>
      </a>
      <div class="header-right">
        <a href="/" data-page="updates">Updates</a>
        <a href="/" data-page="announcements">Announcements</a>
        <time class="local-time" aria-label="Your local time"></time>
      </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="featured-title">
        <h1 id="featured-title">Games</h1>
      </section>

      <section class="game-grid" aria-label="Games">
        <article class="game-card">
          <a class="game-card__image-link" href="/polytrack/" aria-label="Play PolyTrack">
            <img class="game-card__image--contain" src="assets/polytrack.png" alt="PolyTrack game cover" />
          </a>
          <div class="game-card__body"><h2><a href="/polytrack/">PolyTrack</a></h2></div>
        </article>
        <article class="game-card">
          <a class="game-card__image-link" href="/drift-boss/" aria-label="Play Drift Boss">
            <img class="game-card__image--borderless" src="assets/drift-boss.png" alt="Drift Boss game cover" />
          </a>
          <div class="game-card__body"><h2><a href="/drift-boss/">Drift Boss</a></h2></div>
        </article>
        <article class="game-card">
          <a class="game-card__image-link" href="/block-blast/" aria-label="Play Block Blast">
            <img src="assets/block-blast.png" alt="Block Blast game cover" />
          </a>
          <div class="game-card__body"><h2><a href="/block-blast/">Block Blast</a></h2></div>
        </article>
        <article class="game-card">
          <a class="game-card__image-link" href="/escape-road/" aria-label="Play Escape Road">
            <img src="assets/escape-road.png" alt="Escape Road game cover" />
          </a>
          <div class="game-card__body"><h2><a href="/escape-road/">Escape Road</a></h2></div>
        </article>
        <article class="game-card">
          <a class="game-card__image-link" href="/monkey-mart/" aria-label="Play Monkey Mart"><img src="assets/monkey-mart.png" alt="Monkey Mart game cover" /></a>
          <div class="game-card__body"><h2><a href="/monkey-mart/">Monkey Mart</a></h2></div>
        </article>
        <article class="game-card">
          <a class="game-card__image-link" href="/basketball-stars/" aria-label="Play Basketball Stars"><img src="assets/basketball-stars.jpg" alt="Basketball Stars game cover" /></a>
          <div class="game-card__body"><h2><a href="/basketball-stars/">Basketball Stars</a></h2></div>
        </article>
        <article class="game-card">
          <a class="game-card__image-link" href="/drift-hunters/" aria-label="Play Drift Hunters">
            <img class="game-card__image--crop" src="assets/drift-hunters.png" alt="Green sports car drifting — Drift Hunters" />
          </a>
          <div class="game-card__body">
            <h2><a href="/drift-hunters/">Drift Hunters</a></h2>
          </div>
        </article>

        <article class="game-card">
          <a class="game-card__image-link" href="/basket-random/" aria-label="Play Basket Random">
            <img src="assets/basket-random.png" alt="Pixel basketball player dunking — Basket Random" />
          </a>
          <div class="game-card__body">
            <h2><a href="/basket-random/">Basket Random</a></h2>
          </div>
        </article>

        <article class="game-card">
          <a class="game-card__image-link" href="/subway-surfers/" aria-label="Play Subway Surfers">
            <img src="assets/subway-surfers.png" alt="Subway Surfers character holding a spray can" />
          </a>
          <div class="game-card__body">
            <h2><a href="/subway-surfers/">Subway Surfers</a></h2>
          </div>
        </article>

        <article class="game-card">
          <a class="game-card__image-link" href="/bitlife/" aria-label="Play BitLife">
            <img src="assets/bitlife.webp" alt="BitLife game logo" />
          </a>
          <div class="game-card__body">
            <h2><a href="/bitlife/">BitLife</a></h2>
          </div>
        </article>

        <article class="game-card">
          <a class="game-card__image-link" href="/project-sand/" aria-label="Play Project Sand">
            <img class="game-card__image--contain" src="assets/project-sand.jpg" alt="Project Sand game preview" />
          </a>
          <div class="game-card__body">
            <h2><a href="/project-sand/">Project Sand</a></h2>
          </div>
        </article>

        <article class="game-card">
          <a class="game-card__image-link" href="/slope/" aria-label="Play Slope">
            <img src="assets/slope.jpg" alt="Slope game cover" />
          </a>
          <div class="game-card__body"><h2><a href="/slope/">Slope</a></h2></div>
        </article>

        <article class="game-card">
          <a class="game-card__image-link" href="/retro-bowl/" aria-label="Play Retro Bowl">
            <img src="assets/retro-bowl-logo.avif" alt="Retro Bowl game cover" />
          </a>
          <div class="game-card__body"><h2><a href="/retro-bowl/">Retro Bowl</a></h2></div>
        </article>

      </section>
    </main>
    <section class="game-overlay" id="game-overlay" hidden aria-label="Game player">
      <header class="game-toolbar">
        <button class="back-link game-close" id="game-close" type="button">← All games</button>
        <h1 id="game-title">Game</h1>
        <time class="local-time" aria-label="Your local time"></time>
      </header>
      <div class="game-frame-wrap">
        <iframe id="game-player" class="game-frame" title="Game" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe>
      </div>
    </section>
    <section class="info-overlay" id="info-overlay" hidden aria-label="Site information">
      <header class="game-toolbar">
        <button class="back-link game-close" id="info-close" type="button">← Games</button>
        <h1 id="info-title">Simple Games</h1>
        <time class="local-time" aria-label="Your local time"></time>
      </header>
      <main class="page-shell info-content" id="info-content"></main>
    </section>
    <script src="clock.js"></script>
    <script src="play.js?v=9"></script>
  </body>
</html>
