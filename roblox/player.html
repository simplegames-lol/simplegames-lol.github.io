<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox player</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}main{position:fixed;inset:0;overflow:hidden}iframe{position:absolute;left:0;top:0;width:1554px;height:1000px;border:0;transform-origin:0 0;background:#000}</style></head><body><main aria-label="Roblox player"><iframe title="Roblox" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe></main><script>
const frame=document.querySelector('iframe');
// Bunnies uses a 90px rail, 32px gutters, and a 1400px player.
// Keep a fixed provider viewport so its layout remains predictable as ours resizes.
const crop={x:123,y:115,width:1398,height:785};
function fit(){const scale=Math.min(innerWidth/crop.width,innerHeight/crop.height);const x=(innerWidth-crop.width*scale)/2-crop.x*scale,y=(innerHeight-crop.height*scale)/2-crop.y*scale;frame.style.transform=`translate(${x}px,${y}px) scale(${scale})`}
addEventListener('resize',fit);fit();
frame.src='https://bunnies.lat/extra.html?game=Roblox&url=https%3A%2F%2Fnowgg.fun%2Fapps%2Fa%2F19900%2Fb.html';
</script></body></html>
