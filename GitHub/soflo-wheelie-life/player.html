<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soflo Wheelie Life</title><link rel="stylesheet" href="../styles.css"><script src="../appearance.js?v=1"></script><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--background,#000);color:var(--text,#f5f5f7)}
.wheelie-layout{height:100dvh;display:grid;grid-template-columns:minmax(0,1fr) 220px}.wheelie-game{width:100%;height:100%;min-width:0;border:0}.wheelie-controls{padding:24px 18px;border-left:1px solid var(--border,#242a32);overflow:auto}.wheelie-controls h1{font-size:14px;margin:0 0 8px}.wheelie-controls p{font-size:12px;color:var(--muted,#a1a1a6);line-height:1.5;margin:0 0 20px}.wheelie-controls dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:13px 12px;align-items:center;font-size:12px}.wheelie-controls dt{white-space:nowrap}.wheelie-controls dd{margin:0;color:var(--muted,#a1a1a6)}kbd{font:inherit;font-size:11px;border:1px solid var(--border,#242a32);border-radius:5px;padding:3px 6px;display:inline-block;color:var(--text,#f5f5f7)}
@media(max-width:700px){.wheelie-layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.wheelie-controls{border-left:0;border-top:1px solid var(--border,#242a32);padding:12px 16px;max-height:24dvh}.wheelie-controls dl{grid-template-columns:auto 1fr auto 1fr;gap:9px}.wheelie-controls p{margin-bottom:12px}}
</style></head>
<body><main class="wheelie-layout"><iframe class="wheelie-game" src="https://scratch.mit.edu/projects/1231016758/embed" title="Soflo Wheelie Life game" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-orientation-lock allow-presentation" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe><aside class="wheelie-controls" aria-label="Game controls"><h1>Controls</h1><p>Click the green flag to start, then click inside the game.</p><dl><dt><kbd>D</kbd></dt><dd>Throttle</dd><dt><kbd>A</kbd></dt><dd>Brake</dd><dt><kbd>D</kbd> + <kbd>Space</kbd></dt><dd>Ride without a wheelie</dd><dt><kbd>W</kbd></dt><dd>Seat stand</dd><dt><kbd>S</kbd></dt><dd>Knee trick</dd><dt><kbd>E</kbd></dt><dd>Hand drag</dd><dt><kbd>R</kbd></dt><dd>No hands</dd><dt><kbd>C</kbd></dt><dd>Foot over bar</dd><dt><kbd>F</kbd> / <kbd>T</kbd></dt><dd>Change bike</dd><dt><kbd>G</kbd></dt><dd>Change helmet</dd></dl></aside></main></body></html>
